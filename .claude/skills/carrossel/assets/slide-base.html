<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Slide NN</title>
<!--
  MOLDE DE SLIDE da /carrossel (1080×1350, feed do Instagram).
  Um arquivo por slide: copie, troque os tokens do :root pelos do marca/DESIGN.md (UMA vez, igual
  em todos os slides do carrossel) e cole no <body> UM dos layouts de references/layouts.md.
  Não escreva CSS novo dentro de um slide só: se o layout pede algo, o CSS entra aqui e vale pra todos.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* ── tokens do marca/DESIGN.md ── */
  --marca:#1f3b57; --marca-2:#16293d; --acento:#e0a93b;
  --claro:#f3eee4; --claro-2:#fbf8f2; --texto:#1b1b1b; --apagado:#5d6b75;
  --f-titulo:"Anton",Impact,sans-serif;
  --f-texto:"DM Sans",-apple-system,sans-serif;
  --f-rotulo:"DM Mono",Menlo,monospace;
  --titulo-caixa:uppercase;
  --raio:24px;
  /* ── do perfil ── */
  --handle:"@seuperfil";
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:var(--f-texto);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1080px;height:1350px;padding:110px 96px 150px;display:flex;flex-direction:column;justify-content:center}
.escuro{background:var(--marca);color:var(--claro)}
.escuro-2{background:var(--marca-2);color:var(--claro)}
.claro{background:var(--claro);color:var(--texto)}
.claro-2{background:var(--claro-2);color:var(--texto)}

/* rodapé fixo: perfil + contador */
.rodape{position:absolute;left:96px;right:96px;bottom:64px;display:flex;justify-content:space-between;font-family:var(--f-rotulo);font-size:24px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.rodape .h::before{content:var(--handle)}

/* tipografia — line-height mínimo 1.04 em título: acento e til encostam abaixo disso */
.rot{font-family:var(--f-rotulo);font-size:26px;letter-spacing:.18em;text-transform:uppercase}
.escuro .rot,.escuro-2 .rot{color:var(--acento)}
.claro .rot,.claro-2 .rot{color:var(--marca)}
h1,h2,.num{font-family:var(--f-titulo);font-weight:400;text-transform:var(--titulo-caixa);line-height:1.04}
h1{font-size:112px}
h2{font-size:78px}
p{font-size:44px;line-height:1.38}
p+p{margin-top:32px}
.escuro p,.escuro-2 p{color:rgba(243,238,228,.9)}
b{font-weight:600}
.hl{background-image:linear-gradient(var(--acento),var(--acento));background-repeat:no-repeat;background-size:100% 72%;background-position:0 60%;padding:0 .08em;color:var(--marca-2);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mt{margin-top:48px}

/* layouts */
.capa h1{font-size:128px}
.capa .sub{font-size:46px;margin-top:40px;max-width:820px}
.capa .seta{position:absolute;right:96px;bottom:150px;font-family:var(--f-rotulo);font-size:30px;letter-spacing:.14em;color:var(--acento)}
.num{font-size:300px;line-height:.9;color:var(--acento)}
.claro .num,.claro-2 .num{color:var(--marca)}
.lista{list-style:none;margin-top:48px}
.lista li{display:flex;gap:28px;font-size:42px;line-height:1.3;padding:26px 0;border-top:2px solid currentColor}
.lista li:last-child{border-bottom:2px solid currentColor}
.lista .n{font-family:var(--f-rotulo);font-size:32px;color:var(--acento);flex:none;padding-top:6px}
.claro .lista .n,.claro-2 .lista .n{color:var(--marca)}
.citacao blockquote{font-family:var(--f-titulo);text-transform:var(--titulo-caixa);font-size:88px;line-height:1.08;border-left:10px solid var(--acento);padding-left:48px}
.citacao .quem{font-family:var(--f-rotulo);font-size:26px;letter-spacing:.14em;text-transform:uppercase;margin-top:40px;padding-left:58px;opacity:.75}
.vs{display:grid;grid-template-rows:1fr 1fr;gap:28px;margin-top:48px}
.vs>div{border-radius:var(--raio);padding:44px 48px}
.vs .a{border:3px solid currentColor;opacity:.75}
.vs .b{background:var(--acento);color:var(--marca-2)}
.vs .rot{display:block;margin-bottom:16px}
.vs .b .rot{color:var(--marca-2)}
.vs p{font-size:40px}
.vs .b p{color:var(--marca-2)}
.foto{position:absolute;inset:0;background-size:cover;background-position:center}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--marca-2) 18%,transparent 70%)}
.com-foto{justify-content:flex-end}
.com-foto>*:not(.foto):not(.rodape){position:relative;z-index:1}
.cta .botao{display:inline-block;margin-top:56px;background:var(--acento);color:var(--marca-2);font-family:var(--f-rotulo);font-size:34px;letter-spacing:.12em;text-transform:uppercase;padding:30px 48px;border-radius:999px}
</style>
</head>
<body>
<!-- COLE AQUI UM LAYOUT DE references/layouts.md -->
<section class="slide capa escuro">
  <p class="rot">[rótulo curto]</p>
  <h1 class="mt">[Título da capa com <span class="hl">a parte que prende</span>]</h1>
  <p class="sub">[Subtítulo que abre a curiosidade]</p>
  <span class="seta">ARRASTA →</span>
  <div class="rodape"><span class="h"></span><span>01/08</span></div>
</section>
</body>
</html>
